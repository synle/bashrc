# Starship prompt config - separated fields in the three-line bashrc layout
# Line 1: local_time U=utc_time <separator> user <separator> hostname | H/W <separator> ip_address
# Line 2: directory <separator> [git_branch] ahead/behind
# Line 3: bash_version> <separator> python <separator> nodejs
# Bold bright-white U+E0B1 separators use the terminal palette.
# Unicode escapes preserve the separator in source files without raw private-use glyphs.

format = """
${env_var.LOCAL_TIME} \
[U=](bold yellow)${env_var.UTC_TIME}[ \ue0b1 ](bold bright-white)\
$username[ \ue0b1 ](bold bright-white)\
$hostname\
${env_var.PROFILE}\
${env_var.IP_ADDR}\
$fill
${env_var.SHORT_PWD}\
$git_branch\
$git_status\
$fill
${env_var.PROMPT_SYMBOL}${env_var.BASH_VER}\
$python\
$nodejs[ \ue0b1](bold bright-white)"""

# git command budget per prompt. The perceived "prompt hang" IS this timeout: on a slow
# repo starship blocks the whole render until the git call is killed, so a bigger number
# means a longer stall, not more info. Keep it short so the prompt degrades fast (git
# segment silently drops) instead of freezing the terminal. Real speed comes from
# core.fsmonitor + core.untrackedCache in software/scripts/git.gitconfig.
command_timeout = 500

# Increase directory scan timeout from default 30ms to 500ms.
scan_timeout = 500

# disable default newline at top of prompt
add_newline = false

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold purple"
format = "[$hostname]($style)"

[directory]
disabled = true

[git_branch]
style = "bold cyan"
format = "[ \ue0b1 ](bold bright-white)[\\[$branch\\]]($style)"

[git_status]
# the prompt only renders ahead/behind, so never pay for recursing into submodules -
# a dirty submodule tree is the usual reason `git status` blows past command_timeout
ignore_submodules = true
style = "bold cyan"
format = "[ $ahead_behind]($style)"
ahead = "+$count"
behind = "-$count"
diverged = "+$ahead_count -$behind_count"
up_to_date = ""

[fill]
symbol = " "

# disable modules not needed in prompt
[nodejs]
symbol = "⬢ "
style = "bold green"
format = "[ \ue0b1 ](bold bright-white)[$symbol(${version})]($style)"

[python]
symbol = "🐍 "
style = "yellow bold"
pyenv_version_name = true
detect_env_vars = ["VIRTUAL_ENV"]
# Shows e.g. " 🐍 3.12.7 (.venv)" on the prompt line.
format = '[ \ue0b1 ](bold bright-white)[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\))]($style)'

[package]
disabled = true

[cmd_duration]
disabled = false
min_time = 10000
show_milliseconds = false
show_notifications = false
format = "[ took $duration]($style)"
style = "bold yellow"

[line_break]
disabled = true

[character]
disabled = true

[env_var.LOCAL_TIME]
variable = "STARSHIP_LOCAL_TIME"
default = ""
format = "[$env_value](bold green)"

[env_var.UTC_TIME]
variable = "STARSHIP_UTC_TIME"
default = ""
format = "[$env_value](bold yellow)"

[env_var.PROFILE]
variable = "STARSHIP_PROFILE_MARKER"
default = ""
format = "([ | ](bold bright-white)[$env_value](bold purple))"

[env_var.IP_ADDR]
variable = "STARSHIP_IP_ADDR"
default = ""
format = "([ \ue0b1 ](bold bright-white)[$env_value](bold yellow))"

[env_var.SHORT_PWD]
variable = "STARSHIP_SHORT_PWD"
default = ""
format = "[$env_value](bold red)"

[env_var.PROMPT_SYMBOL]
variable = "STARSHIP_PROMPT_SYMBOL"
default = "$"
format = "[$env_value](bold green)"

[env_var.BASH_VER]
variable = "STARSHIP_BASH_VER"
default = ""
format = "[$env_value](bold dim white)"
